version: '3.8'

services:
  web:
    build: .
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - wiki_data:/app/data
    env_file:
      - .env

  mcp:
    build: .
    restart: always
    command: ["uvicorn", "app.api.mcp:mcp_app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - wiki_data:/app/data
    env_file:
      - .env

  worker:
    build: .
    restart: always
    command: ["python", "scripts/worker.py", "--loop"]
    volumes:
      - wiki_data:/app/data
    env_file:
      - .env

volumes:
  wiki_data:
