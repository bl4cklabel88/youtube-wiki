<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}YouTube Wiki{% endblock %} · Automotive Diagnostics KB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    [x-cloak]{display:none}
    .prose-kb h1{font-size:1.875rem;line-height:2.25rem;font-weight:700;color:#f9fafb;margin-top:1.5rem;margin-bottom:.75rem}
    .prose-kb h2{font-size:1.375rem;line-height:1.75rem;font-weight:600;color:#e5e7eb;margin-top:1.25rem;margin-bottom:.5rem;border-bottom:1px solid #1f2937;padding-bottom:.35rem}
    .prose-kb h3{font-size:1.125rem;line-height:1.5rem;font-weight:600;color:#e5e7eb;margin-top:1rem;margin-bottom:.4rem}
    .prose-kb p{margin-top:.55rem;margin-bottom:.55rem;color:#d1d5db}
    .prose-kb ul,.prose-kb ol{margin:.6rem 0 .6rem 1.25rem;color:#d1d5db}
    .prose-kb ul{list-style:disc}
    .prose-kb ol{list-style:decimal}
    .prose-kb li{margin:.2rem 0}
    .prose-kb code{background:#111827;border:1px solid #1f2937;border-radius:.25rem;padding:.05rem .3rem;font-size:.85em;color:#93c5fd}
    .prose-kb pre{background:#0b1220;border:1px solid #1f2937;border-radius:.5rem;padding:.75rem;overflow-x:auto;margin:.75rem 0}
    .prose-kb pre code{background:transparent;border:none;color:#a5b4fc}
    .prose-kb blockquote{border-left:4px solid #374151;padding-left:.9rem;color:#9ca3af;font-style:italic;margin:.75rem 0}
    .prose-kb table{width:100%;border-collapse:collapse;margin:.75rem 0}
    .prose-kb th,.prose-kb td{border:1px solid #1f2937;padding:.4rem .6rem;font-size:.875rem}
    .prose-kb th{background:#111827;color:#e5e7eb}
    .prose-kb hr{border-color:#1f2937;margin:1.25rem 0}
    .prose-kb a{color:#60a5fa;text-decoration:underline}
  </style>
</head>
<body class="h-full bg-gray-950 text-gray-200 antialiased flex flex-col min-h-screen">
  <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-14">
        <div class="flex items-center gap-6">
          <a href="/" class="flex items-center gap-2 font-bold text-lg text-white">
            <span class="inline-flex h-8 w-8 items-center justify-center rounded-md bg-blue-600 text-sm">🔧</span>
            <span>YouTube Wiki</span>
          </a>
          <div class="hidden md:flex items-center gap-4 text-sm text-gray-400">
            <a href="/" class="hover:text-white transition">Browse</a>
            <a href="/submit" class="hover:text-white transition">Submit Video</a>
            {% if admin %}
            <a href="/admin" class="hover:text-white transition text-blue-400">Admin</a>
            <a href="/admin/queue" class="hover:text-white transition text-blue-400">Queue</a>
            {% endif %}
          </div>
        </div>
        <div class="flex items-center gap-3">
          <form action="/" method="get" class="relative hidden sm:block">
            <input type="text" name="q" value="{{ q or '' }}"
                   class="w-56 md:w-72 rounded-md bg-gray-800 border border-gray-700 px-3 py-1.5 pl-8 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-600"
                   placeholder="Search articles…">
            <svg class="absolute left-2.5 top-2 h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </form>
          {% if admin %}
          <a href="/logout" class="text-xs text-gray-500 hover:text-gray-300">Sign out</a>
          {% else %}
          <a href="/login" class="text-xs text-gray-500 hover:text-gray-300">Admin</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-gray-800 mt-10">
    <div class="max-w-7xl mx-auto px-4 py-4 text-xs text-gray-600 flex items-center justify-between">
      <span>Automotive Diagnostic Knowledge Base · Built from YouTube transcripts</span>
      <span>Python + SQLite FTS5 + FastAPI</span>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
