{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
    <h1 class="text-xl font-bold text-white mb-1">Admin Login</h1>
    <p class="text-sm text-gray-500 mb-5">Enter the admin password to manage the wiki.</p>

    {% if error %}
    <div class="mb-4 rounded-lg border border-red-800 bg-red-900/40 p-3 text-sm text-red-200">{{ error }}</div>
    {% endif %}

    <form action="/login" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next_url" value="{{ next_url or '/admin' }}">
      <label class="block text-sm font-medium text-gray-300 mb-2" for="password">Password</label>
      <input type="password" id="password" name="password" required autofocus
             class="w-full rounded-md bg-gray-800 border border-gray-700 px-3 py-2 text-sm text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-600">
      <button type="submit" class="mt-4 w-full rounded-md bg-blue-600 hover:bg-blue-500 px-4 py-2 text-sm font-medium text-white">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
